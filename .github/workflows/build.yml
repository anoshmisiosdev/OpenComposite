name: Build openvr_api.dll (mingw-w64)

# Cross-compiles this OpenComposite fork to a Windows x86_64 openvr_api.dll on an
# Ubuntu runner using mingw-w64 (the same toolchain oxrsys-winebridge uses). The
# DLL is uploaded as a build artifact on every push, and attached to a GitHub
# Release whenever a tag like v1.0.0 is pushed.
#
# Why Ubuntu + mingw and not a Windows/MSVC runner: the MSVC<->GCC x64 ABI
# trampolines in this fork are GCC-specific and must be built with mingw g++ to
# be ABI-correct against the MSVC-compiled games the DLL is dropped into.

on:
  push:
    branches: [merged-fixes, main]
    tags: ['v*']
  pull_request:
    branches: [merged-fixes, main]
  workflow_dispatch: {}   # lets you build on demand from the Actions tab

permissions:
  contents: write          # needed to create Releases on tag builds

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive   # libs/openxr-sdk, libs/glm, libs/libunwind

      - name: Install mingw-w64 + build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 \
            cmake ninja-build
          # C++20 std::thread needs the POSIX-threads mingw variant, not win32.
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Configure (CMake + Ninja, cross to win64)
        run: |
          # -I ci/compat supplies case-forwarding shims for the mixed-case Windows
          # headers (Windows.h, PathCch.h, ...) that only resolve on case-insensitive
          # macOS; the runner filesystem is case-sensitive. See ci/compat/README.md.
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/ci/x86_64-w64-mingw32.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-I$PWD/ci/compat" \
            -DCMAKE_C_FLAGS="-I$PWD/ci/compat"

      - name: Build
        run: cmake --build build --parallel

      - name: Package openvr_api.dll
        id: collect
        run: |
          # OpenComposite's shared lib is emitted as vrclient_x64.dll. The drop-in
          # file games load is that same binary, stripped and renamed openvr_api.dll.
          mkdir -p dist
          cp build/bin/vrclient_x64.dll dist/openvr_api.dll
          x86_64-w64-mingw32-strip dist/openvr_api.dll
          cp build/bin/vrclient_x64.dll dist/   # keep the unstripped lib too
          echo "----- packaged DLLs -----"
          ls -la dist/
          file dist/openvr_api.dll
          # sanity: it must export the OpenVR entrypoint or it is not a valid drop-in
          x86_64-w64-mingw32-objdump -p dist/openvr_api.dll | grep -q VR_InitInternal2 \
            || { echo "::error::openvr_api.dll missing VR_InitInternal2 export"; exit 1; }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: openvr_api-dll-win64
          path: dist/*.dll
          if-no-files-found: error

      - name: Attach to Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dll
          generate_release_notes: true
